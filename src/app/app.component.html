<div class="container" id="title">
  <div class="home-header">
    <img src="assets/logo.png" alt="App Logo" class="logo" />
    <h1>Welcome to Tazer's Backoffice</h1>
    <p class="subtitle">
      Manage users efficiently and securely. Please log in or register to continue.
    </p>
  </div>
</div>

<div *ngIf="loggedin; else notLoggedIn">
  <div *ngIf="isAdmin; else userView">
    <app-backoffice></app-backoffice>
  </div>
  <ng-template #userView>
    <router-outlet></router-outlet>
  </ng-template>
</div>

<ng-template #notLoggedIn>
  <div class="auth-section">
    <app-login (exportLoggedIn)="getLoggedIn($event)"></app-login>
    <div class="divider"></div>
    <app-register></app-register>
  </div>
</ng-template>
